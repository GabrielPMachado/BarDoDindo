# Testa as regras do Firestore nos emuladores e gera um link de prévia temporário do site para cada pull request
# (as regras do Firestore de produção não são alteradas).

name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            crm/package-lock.json
      - run: npm ci
      - run: npm --prefix crm ci
      - run: npm run build:all
      # regras de segurança do Firestore: roda os testes nos emuladores antes de publicar
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Testar regras do Firestore
        run: npm run testar:regras
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BARDO_C0878 }}
          projectId: bardo-c0878
